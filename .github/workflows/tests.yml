name: tests

# The first machine check in this lineage's history. The suite is hermetic — no Blender, no AC,
# no network — and needs only the stdlib plus Pillow (tools/make_map.py draws map.png; a test imports
# it), so it runs anywhere in minutes. It cannot judge a track (rule 0: only the game does that); it
# judges the engine that builds one.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # the full suite takes ~11 min on a hosted runner (968 tests, several build fixtures)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The fleet on Lake Murray's engine (ledgers 0078-0089) brought tests that import numpy (the aerial engine, road wear,
      # lidar ground, far ground) and pytest fixtures (tools/ac_tidy.py's tmp_path / monkeypatch / capsys), which the
      # dependency-free tests/run_tests.py cannot supply: CI installs the dev env's libraries and runs pytest
      # (integration 2026-11-10). tests/run_tests.py stays the stdlib runner for a bare machine.
      - name: Install the test dependencies
        run: python3 -m pip install --quiet pillow numpy scipy shapely pyproj rasterio trimesh pytest
      - name: Run test suite
        run: python3 -m pytest -q -p no:cacheprovider tests

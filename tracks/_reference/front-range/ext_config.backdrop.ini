; The shared Front Range backdrop: what a track's extension/ext_config.ini must carry for AC + CSP to draw it.
; A FRAGMENT. Not installed anywhere; a track's build merges it into its own ext_config.ini.
; Source: tracks/denver-grand-prix/source/farclip/RESULT.md (PC, 2026-11-22, CSP 0.3.0-preview581): with these two
; keys on the backdrop's meshes, present when the track loads, geometry draws at 25, 60 and 105 km; without them
; drawing stops between 19 and 25 km. Not tested: which key alone suffices, motion, frame rate.
; MESHES must match the bake's mesh_prefix (bake.config.json): the objects are BACKDROP_FR_000, BACKDROP_FR_001, ...
; The haze / fog material look is not decided here (PLAN 3a: the next PC test).

[SHADER_REPLACEMENT_BACKDROP_FR]
MESHES = BACKDROP_FR_?
DISTANT_FIX = 1
DISABLE_FAR_PLANE_CLIPPING = 1
